{% load care_tags %}<li class="chosen-row editor-card" data-key="{{ row.spec.key }}" data-module="{{ row.spec.key }}">
<div class="editor-card-tools"><span class="module-symbol">{% icon row.spec.icon %}</span><button type="button" class="drag-handle icon-button" aria-label="{{ row.spec.name }} 순서 이동" title="잡아서 이동 · Space로 선택, 방향키로 이동">{% icon 'grip' %}</button><button type="button" class="icon-button remove-module" data-remove-module="{{ row.spec.key }}" aria-label="{{ row.spec.name }} 사용 목록에서 빼기" title="목록에서 빼기 · 기록은 유지">{% icon 'close' %}</button></div>
<div class="chosen-label"><strong>{{ row.spec.name }}</strong><p class="config-description">{{ row.spec.description }}</p><label class="pin-label"><input type="checkbox" data-pin-module="{{ row.spec.key }}" {% if row.pinned %}checked{% endif %}><span>오늘에 표시</span></label></div>
</li>
