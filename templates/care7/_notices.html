
{% if notices %}<section class="section" aria-label="다가오는 일정 안내"><div class="section-heading"><div><h2>다가오는 일정</h2><p class="meta">확인한 안내는 닫아도 괜찮아요. 일정 자체는 관리 목록에 남아요.</p></div><a href="{% url 'routines' room.id %}" class="quiet-link">일정 관리</a></div><div class="notice-list7">{% for notice in notices %}<article data-notice7><a href="{{ notice.url }}"><small>{{ notice.kind }} · {{ notice.due|date:'m.d' }}</small><strong>{{ notice.title }}</strong><span>{{ notice.timing }}</span></a><button type="button" class="icon-button" data-dismiss-notice7 data-key="{{ notice.key }}" data-stage="{{ notice.stage }}" aria-label="{{ notice.title }} 안내만 닫기">×</button><p data-action-feedback7 role="status" hidden></p></article>{% endfor %}</div></section>{% endif %}
