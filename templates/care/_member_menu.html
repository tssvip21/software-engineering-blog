{% load care_tags %}{% if member.role == 'owner' and person.role != 'owner' %}<details class="member-menu"><summary aria-label="{{ person.display_name }} 관리 메뉴" title="{{ person.display_name }} 관리" class="icon-button">{% icon 'more' %}</summary><div class="member-menu-body"><strong>{{ person.display_name }}</strong>{% if person.user_id %}<form method="post" action="{% url 'member_change' room.id person.id %}" data-member-action>{% csrf_token %}<input type="hidden" name="action" value="{% if person.role == 'admin' %}demote{% else %}promote{% endif %}"><button type="submit">{% if person.role == 'admin' %}관리자 권한 해제{% else %}관리자로 지정{% endif %}</button></form>{% else %}<p class="meta">관리자 지정에는 구글 계정 연결이 필요해요.</p>{% endif %}<form method="post" action="{% url 'member_change' room.id person.id %}" data-member-action data-remove-person="{{ person.display_name }}">{% csrf_token %}<input type="hidden" name="action" value="remove"><label class="inline-check"><input type="checkbox" name="revoke_links" value="1" checked>기존 초대 링크도 폐기</label><button type="submit" class="danger-text">방에서 내보내기</button></form><p class="meta">내보내도 작성한 기록은 남아요.</p><p data-member-status role="status"></p></div></details>{% endif %}
