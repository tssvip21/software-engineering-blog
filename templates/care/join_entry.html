{% extends 'care/base.html' %}{% block content %}<div class="join-layout"><div class="page-heading"><div><p class="eyebrow">초대 참여</p><h1>함께 돌볼 공간에 참여</h1><p class="lead">방장에게 받은 초대 링크를 확인해요.</p></div></div><div class="form-panel"><form method="post" action="{% url 'join_preview' %}" id="join-token-form">{% csrf_token %}<div class="field"><label for="join-token">초대 링크 또는 초대 코드</label><input id="join-token" name="token" autocomplete="off" required maxlength="2048" placeholder="받은 초대 링크를 붙여 넣으세요"></div><button class="button primary">초대 확인</button></form><p class="meta">링크를 확인하는 것만으로 참여하거나 기록을 작성하지 않습니다.</p></div></div>{% endblock %}
