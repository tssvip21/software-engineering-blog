<figure class="chart-panel"><figcaption><h3>{{ chart.title }}</h3><span class="meta">{{ chart.unit }} · {{ chart.start|date:'m.d' }}–{{ chart.end|date:'m.d' }}</span></figcaption>{% if chart.has_data %}<div class="chart-axis"><span>{{ chart.max }}</span><span>{{ chart.min }}</span></div><svg class="data-chart" viewBox="0 0 736 212" role="img" aria-label="{{ chart.title }}. 자세한 값은 아래 데이터 표에 있습니다."><path class="chart-grid" d="M16 14H720M16 58H720M16 102H720M16 146H720M16 190H720"/>{% if chart.kind == 'line' %}{% for segment in chart.segments %}<polyline class="chart-line" points="{{ segment }}"/>{% endfor %}{% for point in chart.points %}{% if point.value is not None %}<circle class="chart-point" cx="{{ point.x }}" cy="{{ point.y }}" r="3"><title>{{ point.date|date:'Y.m.d' }} · {{ point.value }} {{ chart.unit }}</title></circle>{% endif %}{% endfor %}{% else %}{% for point in chart.points %}{% if point.value is not None %}<rect class="chart-bar" x="{{ point.bar_x }}" y="{{ point.bar_y }}" width="{{ point.bar_width }}" height="{{ point.bar_height }}" rx="2"><title>{{ point.date|date:'Y.m.d' }} · {{ point.value }} {{ chart.unit }}</title></rect>{% endif %}{% endfor %}{% endif %}</svg><div class="chart-dates"><span>{{ chart.start|date:'m.d' }}</span><span>{{ chart.end|date:'m.d' }}</span></div><details class="chart-data"><summary>날짜별 값 보기</summary><div class="table-scroll"><table><caption class="sr-only">{{ chart.title }} 날짜별 값</caption><thead><tr><th scope="col">날짜</th><th scope="col">값 ({{ chart.unit }})</th></tr></thead><tbody>{% for point in chart.points %}<tr><th scope="row">{{ point.date|date:'Y.m.d' }}</th><td>{% if point.value is not None %}{{ point.value }}{% else %}미기록{% endif %}</td></tr>{% endfor %}</tbody></table></div></details>{% else %}<div class="empty-state compact"><p>이 기간에 표시할 값이 없습니다.</p><span class="meta">미기록은 실제 활동량 0을 뜻하지 않습니다.</span></div>{% endif %}</figure>
