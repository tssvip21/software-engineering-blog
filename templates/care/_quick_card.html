{% load care_tags %}<article class="module-card"><div class="module-card-head"><span class="module-symbol">{% icon card.spec.icon %}</span><a href="{% url 'module' room.id card.spec.key %}"><h3>{{ card.spec.name }}</h3></a></div><p class="meta">{% if card.count %}오늘 {{ card.count }}건 기록{% elif card.latest %}최근 {{ card.latest.occurred_at|date:'m.d H:i' }}{% else %}첫 기록을 남겨 보세요{% endif %}</p><div class="module-card-actions"><a class="quiet-link" href="{% url 'module' room.id card.spec.key %}">기록 보기</a><a class="button small secondary" href="{% url 'record_new' room.id card.spec.key %}{% if card.spec.key == 'walk' %}?start=1{% endif %}">{% if card.spec.key == 'walk' %}산책 시작{% else %}{% icon 'plus' %}기록{% endif %}</a></div></article>
