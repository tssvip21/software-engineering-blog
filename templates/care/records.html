{% extends 'care/base.html' %}{% block content %}<div class="page-heading"><div><h1>전체 기록</h1><p class="lead">누가, 언제, 어떤 돌봄을 했는지 모아 봅니다.</p></div></div><form class="filter-panel" method="get"><div class="field"><label for="filter-module">모듈</label><select id="filter-module" name="module"><option value="">모든 모듈</option>{% for key,name in module_choices %}<option value="{{ key }}" {% if selected_module == key %}selected{% endif %}>{{ name }}</option>{% endfor %}</select></div><div class="field"><label for="filter-state">상태</label><select id="filter-state" name="state"><option value="valid" {% if selected_state == 'valid' %}selected{% endif %}>유효한 기록</option><option value="done" {% if selected_state == 'done' %}selected{% endif %}>완료</option><option value="active" {% if selected_state == 'active' %}selected{% endif %}>진행 중</option><option value="planned" {% if selected_state == 'planned' %}selected{% endif %}>예정</option><option value="cancelled" {% if selected_state == 'cancelled' %}selected{% endif %}>취소됨</option><option value="all" {% if selected_state == 'all' %}selected{% endif %}>전체 포함</option></select></div><div class="field"><label for="filter-author">작성자</label><select name="author" id="filter-author"><option value="">모든 작성자</option>{% for author in authors %}<option value="{{ author.id }}" {% if selected_author == author.id|stringformat:'s' %}selected{% endif %}>{{ author.display_name }}{% if not author.active %} (퇴장){% endif %}</option>{% endfor %}</select></div><div class="field"><label for="filter-start">시작일</label><input id="filter-start" type="date" name="start" value="{{ start }}"></div><div class="field"><label for="filter-end">종료일</label><input id="filter-end" type="date" name="end" value="{{ end }}"></div><div class="field"><label for="filter-q">내용 검색</label><input id="filter-q" type="search" name="q" value="{{ query }}" maxlength="100" placeholder="제품명·메모 등"></div><div class="row-actions"><button class="button primary">조회</button><a class="quiet-link" href="{% url 'records' room.id %}">초기화</a></div></form>{% if problem %}<div class="form-errors">{{ problem }}</div>{% endif %}<div class="section-heading"><h2>조회 결과</h2><span class="meta">{{ page_obj.paginator.count }}건</span></div><div class="panel flush">{% include 'care/_record_list.html' with records=page_obj.object_list %}</div>{% include 'care/_pagination.html' %}{% endblock %}
