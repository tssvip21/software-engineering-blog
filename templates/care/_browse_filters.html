<div class="browse-filters"><div class="category-pills" role="group" aria-label="모듈 기본 분류"><button type="button" data-module-filter="all" aria-pressed="true">전체</button>{% for category in module_categories %}<button type="button" data-module-filter="{{ category.key }}" aria-pressed="false">{{ category.label }}</button>{% endfor %}</div>{% if custom_groups %}<label class="custom-filter-label">내 그룹<select data-custom-filter><option value="all">모든 그룹</option>{% for group in custom_groups %}<option value="{{ group.key }}">{{ group.label }}</option>{% endfor %}</select></label>{% endif %}</div>
