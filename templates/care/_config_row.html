{% load care_tags %}<li class="chosen-row" data-key="{{ row.spec.key }}"><button type="button" class="drag-handle icon-button" aria-label="{{ row.spec.name }} 순서 이동" title="잡아서 이동 · Space 키로 선택">{% icon 'grip' %}</button><span class="module-symbol">{% icon row.spec.icon %}</span><div class="chosen-label"><strong>{{ row.spec.name }}</strong><label class="pin-label"><input type="checkbox" data-pin-module="{{ row.spec.key }}" {% if row.pinned %}checked{% endif %}>오늘 고정</label></div><div class="chosen-controls"><div class="move-alternatives"><button type="button" data-order-step="-1" aria-label="{{ row.spec.name }} 위로 이동">↑</button><button type="button" data-order-step="1" aria-label="{{ row.spec.name }} 아래로 이동">↓</button></div><button type="button" class="text-button" data-remove-module="{{ row.spec.key }}" aria-label="{{ row.spec.name }} 빼기">빼기</button></div></li>
