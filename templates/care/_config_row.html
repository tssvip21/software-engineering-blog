{% load care_tags %}<li class="chosen-row" data-key="{{ row.spec.key }}"><button type="button" class="drag-handle icon-button" aria-label="{{ row.spec.name }} 순서 이동" title="잡아서 이동 · Space로 선택, 방향키로 이동">{% icon 'grip' %}</button><span class="module-symbol">{% icon row.spec.icon %}</span><div class="chosen-label"><strong>{{ row.spec.name }}</strong><label class="pin-label"><input type="checkbox" data-pin-module="{{ row.spec.key }}" {% if row.pinned %}checked{% endif %}>오늘 고정</label></div><button type="button" class="icon-button remove-module" data-remove-module="{{ row.spec.key }}" aria-label="{{ row.spec.name }} 목록에서 빼기" title="{{ row.spec.name }} 목록에서 빼기 · 기존 기록은 유지">{% icon 'close' %}</button></li>
